<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZicoChat AI</title>
    <!-- React & Babel for "No-Risk" running on school computer -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .intro-text { text-align: center; max-width: 440px; margin-bottom: 32px; font-size: clamp(15px, 3.5vw, 19px); line-height: 1.6; }
        .chip-container { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; max-width: 500px; }
        .suggestion-chip {
            background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 20px;
            color: #d0d0d0; padding: 9px 16px; cursor: pointer; display: flex;
            align-items: center; gap: 7px; transition: all 0.15s; white-space: nowrap;
        }
        .suggestion-chip:hover { background: #333; border-color: #555; color: #fff; }
        .input-box { margin-top: 30px; padding: 12px; width: 80%; max-width: 400px; border-radius: 10px; border: 1px solid #3a3a3a; background: #2a2a2a; color: white; outline: none; }
        .send-btn { margin-top: 10px; padding: 10px 20px; border-radius: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function ZicoChat() {
            const [input, setInput] = useState("");
            const inputRef = useRef(null);

            const chips = [
                { emoji: "📐", text: "Βοήθεια με μαθηματικά" },
                { emoji: "😂", text: "Πες μου ένα αστείο" },
                { emoji: "🌍", text: "Πού είναι η Ελλάδα;" },
                { emoji: "🦕", text: "Πότε εξαφανίστηκαν οι δεινόσαυροι;" },
                { emoji: "⚽", text: "Ποια είναι η καλύτερη ομάδα;" },
                { emoji: "🚀", text: "Πώς πετάνε τα ρακέτα;" }
            ];

            const handleChipClick = (text) => {
                setInput(text);
                setTimeout(() => {
                    if (inputRef.current) inputRef.current.focus();
                }, 50);
            };

            return (
                <div>
                    <div className="intro-text">
                        <p>Είμαι 10 χρονών, Έλληνας, και ξέρω πολλά πράγματα.<br />
                        Ρώτα με ό,τι θέλεις – σχολείο, ζωή, οτιδήποτε!</p>
                    </div>

                    <div className="chip-container">
                        {chips.map((chip) => (
                            <button 
                                key={chip.text} 
                                className="suggestion-chip"
                                onClick={() => handleChipClick(chip.text)}
                            >
                                <span>{chip.emoji}</span>
                                <span>{chip.text}</span>
                            </button>
                        ))}
                    </div>

                    <div style={{ textAlign: 'center' }}>
                        <input 
                            ref={inputRef}
                            className="input-box"
                            type="text" 
                            value={input} 
                            onChange={(e) => setInput(e.target.value)}
                            placeholder="Type here..."
                        />
                        <br />
                        <button className="send-btn" onClick={() => alert("Connecting to AI...")}>Send</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ZicoChat />);
    </script>
</body>
</html>
