<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Πατατάκης Chat</title>
    <!-- Load React and Babel from CDN -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #212121; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // CHANGE THIS: Your Replit Backend URL
        const BASE = "https://repl.co"; 
        const STORAGE_KEY = "patatakis_conv_id";

        function saveConvId(id) {
            try { localStorage.setItem(STORAGE_KEY, String(id)); } catch { }
        }
        function loadConvId() {
            try { return localStorage.getItem(STORAGE_KEY); } catch { return null; }
        }
        function clearConvId() {
            try { localStorage.removeItem(STORAGE_KEY); } catch { }
        }

        async function createConversation() {
            const res = await fetch(`${BASE}/api/openai/conversations`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: "Πατατάκης Chat" }),
            });
            if (!res.ok) throw new Error("Could not create conversation");
            const data = await res.json();
            saveConvId(data.id);
            return data.id;
        }

        function PatatakisChat() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState("");
            const [isTyping, setIsTyping] = useState(false);
            const [started, setStarted] = useState(false);
            const chatboxRef = useRef(null);
            const msgIdRef = useRef(0);
            const convIdRef = useRef(loadConvId());

            const nextId = () => ++msgIdRef.current;

            const scrollBottom = () => {
                setTimeout(() => {
                    if (chatboxRef.current) chatboxRef.current.scrollTop = chatboxRef.current.scrollHeight;
                }, 40);
            };

            useEffect(() => { scrollBottom(); }, [messages, isTyping]);

            const getOrCreateConversation = useCallback(async () => {
                if (convIdRef.current) return convIdRef.current;
                const id = await createConversation();
                convIdRef.current = id;
                return id;
            }, []);

            const send = async () => {
                const text = input.trim();
                if (!text || isTyping) return;

                if (!started) setStarted(true);
                setInput("");
                setMessages(prev => [...prev, { role: "user", content: text, id: nextId() }]);
                setIsTyping(true);

                try {
                    const convId = await getOrCreateConversation();
                    const res = await fetch(`${BASE}/api/openai/conversations/${convId}/messages`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ content: text }),
                    });

                    if (res.status === 404) {
                        clearConvId();
                        convIdRef.current = null;
                        return send(); 
                    }

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let assistantMsg = "";
                    const msgId = nextId();

                    setIsTyping(false);
                    setMessages(prev => [...prev, { role: "assistant", content: "", id: msgId }]);

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value);
                        for (const line of chunk.split("\n")) {
                            if (line.startsWith("data: ")) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    if (data.content) {
                                        assistantMsg += data.content;
                                        setMessages(prev => prev.map(m => m.id === msgId ? { ...m, content: assistantMsg } : m));
                                    }
                                } catch (e) { }
                            }
                        }
                    }
                } catch (e) {
                    setIsTyping(false);
                    setMessages(prev => [...prev, { role: "assistant", content: "Σφάλμα σύνδεσης! 📡", id: nextId() }]);
                }
            };

            return (
                <div style={{ display: "flex", flexDirection: "column", height: "100vh", color: "#fff", fontFamily: "sans-serif" }}>
                    <div style={{ padding: "20px", background: "#212121", borderBottom: "1px solid #333", textAlign: "center" }}>
                        <input 
                            value={input} 
                            onChange={e => setInput(e.target.value)} 
                            onKeyDown={e => e.key === 'Enter' && send()}
                            placeholder="Ρώτησε τον Πατατάκη..."
                            style={{ width: "80%", padding: "10px", borderRadius: "20px", border: "none", outline: "none" }}
                        />
                        <button onClick={send} style={{ marginLeft: "10px", borderRadius: "50%", padding: "10px" }}>↑</button>
                    </div>
                    <div ref={chatboxRef} style={{ flex: 1, overflowY: "auto", padding: "20px" }}>
                        {messages.map(m => (
                            <div key={m.id} style={{ marginBottom: "10px", textAlign: m.role === "user" ? "right" : "left" }}>
                                <div style={{ 
                                    display: "inline-block", 
                                    padding: "10px", 
                                    borderRadius: "10px", 
                                    background: m.role === "user" ? "#ffcc00" : "#333",
                                    color: m.role === "user" ? "#000" : "#fff" 
                                }}>
                                    {m.content}
                                </div>
                            </div>
                        ))}
                        {isTyping && <div>Σκέφτεται...</div>}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PatatakisChat />);
    </script>
</body>
</html>
